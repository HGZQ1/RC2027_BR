# 从规则书 + 两个仿真仓库抄出来的场地几何数据。
#
# 来源:
#   - Robocon_2027_Rulebook_v1-1.pdf（官方规则，权威尺寸）
#   - heartpain-kong/rc2027_field（MuJoCo模型，field.xml 的 <site> 精确坐标，已与官方CAD比对）
#
# 坐标系约定: 【已确认，见 docs/decisions/0003-field-localization.md】
#   原点 = 场地中心，坐标轴直接用 field.xml 的原生轴，不旋转。
#   x 轴正方向指向蓝方（x=0 是红蓝对称轴，镜像就是 x → -x，实测 start/L1 retry
#   两组网格数据独立验证过）；y 轴正方向是灵石基座/储存区那一侧，开局时机器人
#   面朝 +y（所以地图系里"开局朝向"对应 yaw=90°，不是 0°——为了不用对已经抄的
#   building_spots 数据做二次旋转变换，没有把开局朝向定义成 +x）。
#   z 向上，右手系。
#
# 红蓝镜像公式: (x, y, yaw) → (-x, y, π - yaw)（位置只翻 x，朝向要翻成 π-yaw，
#   不是简单的 -yaw——镜面反射对朝向的作用是这样的；和 GAFA 去年 config.py 里
#   `_mw()` 的公式一致）。
# ⚠️ 这个公式只管"点位"，不管车本身：机构装在车体哪一侧是固定的、不会跟着镜像
#   翻过去（比如机构在左侧，到了蓝方场地依然在左侧），涉及"从哪一侧接近目标"
#   的动作不能直接套用镜像后的坐标，需要在策略层单独处理
#
# 状态：草稿，数值已用 field.xml 网格顶点坐标（不是插图目测）核对过，
# L1 Retry Zone 朝南（-90°，2026-10-04 用户定）

field:
  size_m: [11.1, 11.1]          # 含围栏；纯比赛区域是 11.0 x 11.0（规则书 2.1）

# 10 个建塔点，抄自 rc2027_field/field.xml 的 <site name="site_建造点-*">，500x500。
# 在哪一层（2026-10-04 按 levels 的尺寸 + Gazebo 场地网格查高度核对过）：
#   L2（|x|、|y| ≤ 1.5，台面 0.9）：spot_05 06 08 09（±1.25, ±1.25）
#   L1（台面 0.6）：其余 6 个
# 哪些算本方 / 共享区还没标（规则书图里看，等需要时补）
building_spots:
  spot_01: [ 0.0000, -2.7000]
  spot_02: [ 0.0000,  2.7000]
  spot_03: [-2.7000,  2.7000]
  spot_04: [ 2.7000,  2.7000]
  spot_05: [-1.2500,  1.2500]
  spot_06: [ 1.2500,  1.2500]
  spot_07: [-2.7000, -2.7000]
  spot_08: [-1.2500, -1.2500]
  spot_09: [ 1.2500, -1.2500]
  spot_10: [ 2.7000, -2.7000]

# Start Zone：规则书"两个 700x700mm 的格子，间隙 100mm，TR/BR 自由选择"。
# box_a 是靠边那个（离场地边界更远，x 绝对值更大），box_b 是靠里那个。
# yaw 是开局时机器人面朝场内的朝向（贴着场地边界墙，唯一自然朝向）。
# 抄自 rc2027_field/field.xml 的 start_red.obj / start_blue.obj 网格顶点坐标，
# 两个格子的中心点经过主线和助教独立计算交叉核对，一致。
#
# 2026-10-03 暂定分配（减少两车开局路线交汇，见 0003）：
# TR 用 box_a（靠边，沿边去储存区）；BR 用 box_b（靠里，靠近 L1 的台阶/坡道）。
# 本仓库这台车是 BR，field_localizer 的默认 start_box 已经设成 box_b。
start_zone:
  red:
    box_a: {center: [-5.15, -5.15], yaw: 1.5708}   # 90°，面朝 +y（场内方向）；TR
    box_b: {center: [-4.35, -5.15], yaw: 1.5708}   # BR（本仓库默认）
  blue:
    box_a: {center: [5.15, -5.15], yaw: 1.5708}    # TR
    box_b: {center: [4.35, -5.15], yaw: 1.5708}    # BR（本仓库默认）

# L1 Retry Zone：规则 5.3.1，BR 可选回这里代替 Ground Start Zone（需本场已完整
# 进过一次 L1），700x700mm。抄自 field.xml 的 l1_retry_red.obj / l1_retry_blue.obj。
# **在 L1 平台上**（BR 上楼以后 Retry 就回这里）。
#
# z：脚下表面高度 = L1 高度 0.6 m（下面 levels.l1）。field_localizer 锁定时用它，没有它
#   map 系会低 0.6 m（2026-10-04 加；Start Zone 在地面，不写就是 0）。
#   仿真 Gazebo 场地整体抬了 5 cm（地面 0.05、L1 顶 0.65），这 5 cm 由 ICP 修掉，不改这里
# yaw：**朝南（-90°，面朝 -y）**，2026-10-04 用户定的（同一天上午先暂填过 90°）。
#   镜像公式 π - yaw 对 -90° 得 270°，还是朝南，红蓝一样
l1_retry_zone:
  red:
    center: [-1.8, 2.6]
    z: 0.6
    yaw: -1.5708   # 朝南
  blue:
    center: [1.8, 2.6]
    z: 0.6
    yaw: -1.5708   # 朝南

# Transfer Area（交接区）：1000x1000 的平台，在 L1 台面高度（0.6），夹在西 / 东侧楼梯顶和坡道之间。
# 抄自 rc2027_field/field_with_objects.xml 的 col_band_{red,blue}_plat（规则 2.16 / 2.18），
# Gazebo 网格查过高度（0.65 = 0.6 + 仿真抬高的 5 cm）。红蓝按 x 镜像。2026-10-04 加（方块检测要用）
transfer_area:
  red:  {center: [-3.5, -1.3], size: [1.0, 1.0], z: 0.6}
  blue: {center: [ 3.5, -1.3], size: [1.0, 1.0], z: 0.6}

# 灵石基座（Mustika Pillar），抄自 field.xml 的 mustika_pillar.obj，
# 和规则书写的 "(0, +4.25)" 吻合
mustika_pillar: [0.0, 4.25]

levels:
  l1:
    size_m: [6.0, 6.0]
    height_m: 0.6
  l2:
    size_m: [3.0, 3.0]
    height_m: 0.9
