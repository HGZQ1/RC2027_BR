# ============================================================
#  RC2027 机器人物理参数集中管理
#  沿用 GAFA 去年 rc2026_bringup/config/robot_params.yaml 的集中管理思路：
#  改尺寸只改这一个文件，URDF 不用动。
#
#  ⚠️ 这份文件整个是占位骨架：
#    - 底盘 2026-10-04 定了是**舵轮**（用户确认，见 docs/decisions/0005-navigation.md），
#      但模块数量、位置、轮径都还没定，chassis 这一节的数字是占位。模块数量先按最常见的
#      4 个放在四角；如果实际是 3 个，改 URDF 里那 4 行 swerve_module 调用即可
#    - lidar/camera 这两节数字是随便填的占位值，不是任何实测结果，机械没定稿
#      前不能当真；这两节本身（有雷达、有相机、各自一个 xyz+rpy 安装点）这个
#      "形状"大概率不会变，等有实测数据直接替换数字即可
# ============================================================

# ── 底盘几何参数（舵轮，数字是占位） ──
chassis:
  type: "swerve"                   # 舵轮（全向：cmd_vel 的 vx/vy/wz 都能用）
  width: 0.30                      # 占位：底盘宽度 (X方向，米)
  depth: 0.30                      # 占位：底盘深度 (Y方向，米)
  height: 0.15                     # 占位：底盘主体高度 (米，不含轮子/传感器)

  # 舵轮模块：4 个，四角对称，(±module_offset_x, ±module_offset_y)
  # 2026-10-04 从差速两驱占位换过来；差速时的 separation、脚轮都删了
  wheel:
    radius: 0.05                   # 占位：轮半径 (米)。base_link 原点在轮轴高度，
                                   # 改它会连带改雷达/相机离地高度
    width: 0.03                    # 占位：轮宽 (米)
  module_offset_x: 0.10            # 占位：模块中心相对 base_link 的前后偏移 (米)
  module_offset_y: 0.10            # 占位：模块中心相对 base_link 的左右偏移 (米)

# ── 激光雷达安装参数（Livox Mid-360S） ──
# 数字是占位，真实值要等装车后用 rc2027_utils/calibrate_lidar_base.py 标定
# 水平偏移 + 卷尺实测高度，见该脚本 README
# 2026-10-04 按用户说的机械习惯改：雷达装在**车头、往前下方斜装**（跟去年一样），主要看前面和
# 脚下，货存车后。具体数还是占位（机械没出图），但"车头外伸 + 前倾"这个形状是定了的。
# 为什么必须外伸：前倾 30° 以后正前方最低看到 -37°，雷达如果坐在底盘顶面中央，朝前的射线有 32%
# 打在自己底盘顶上（host 上按底盘盒子算过）；放到车头外面（后表面贴着底盘前沿）就是 0%。
lidar:
  # 占位：前向偏移 = 底盘半长(0.15) + 雷达半径(0.05)，雷达后表面贴着底盘前沿、整个伸在车头外
  offset_x: 0.20
  offset_y: 0.0                    # 占位：相对 base_link 横向偏移 (米，正=左)
  # 占位：安装高度 (米，从 base_link 原点算) = chassis.height(0.15) + 雷达
  # 自身半高(0.03)，跟底盘顶面齐平。之前随手填的 0.25 没检查跟底盘
  # 高度的关系，2026-10-03 实机 rviz 看出来悬空飘在半空（"飞天"），改掉
  offset_z: 0.18
  roll: 0.0
  # 占位：前下倾 30°（ROS 约定 pitch 为正 = 车头方向朝下）。真车的角度等机械定。
  # 真车上 livox_ros_driver2 的"IMU 跟随外参旋转"patch 配置的 extrinsic 角度要和这里一致，
  # 见 external_ws/src/livox_ros_driver2/NOTES.md；仿真里雷达和 IMU 挂在同一个倾斜的 link 上，
  # Point-LIO 开机用重力方向自己对齐（imu_en: true），不用改仿真配置
  pitch: 0.5236
  yaw: 0.0

# ── 相机安装参数（Intel RealSense D435i） ──
camera:
  offset_x: 0.15                   # 占位：相对 base_link 前向偏移 (米)
  offset_y: 0.0                    # 占位：相对 base_link 横向偏移 (米，正=左)
  # 占位：安装高度 (米)。原来 0.16（底盘顶面上），2026-10-04 雷达挪到车头以后跟雷达重叠了，
  # 挪到雷达正下方、底盘前脸上（底盘 z 0～0.15）。雷达前倾 30° 后往后看的射线都朝上，
  # 打不到下面的相机。真实位置等机械
  offset_z: 0.08
  roll: 0.0
  pitch: 0.0
  yaw: 0.0

# ── TF 坐标系命名（给其他包引用时统一名字用，不是坐标系本身的定义） ──
frames:
  base_footprint: "base_footprint"
  base_link: "base_link"
  lidar: "lidar_link"
  camera: "camera_link"
  odom: "lidar_odom"               # Point-LIO 的世界系，0001 定的名字，不是通用的 odom
  lidar_imu: "lidar_imu_link"      # Point-LIO 的 body（Mid-360 内置 IMU），见 URDF
  map: "map"
