# 仿真里跑通的接近位姿，给还没写的规则规划器用。按建造点名取，不要从流程 yaml 里反推。
# 间隙 15 cm（gripper_offset 0.575），预备位再退 approach_distance 0.3 m，观察位离塔心 2.3 m。
# map 系，theta 弧度。2026-10-07 用户：南部共享区三次全流程正常，先把这套点留下。
#
# 用法（规划器）：spots[建造点名] 的 lane → pre → place 去放，look 去看。
# transfer 是交接区观察 / 入口，不是建造点。

gripper_offset: 0.575
approach_distance: 0.30
look_distance: 2.3

transfer:
  # 2026-10-10 先顶这个：校准和看货同一个点。东西线上再往东，识别干净但校准掉到 0.4。
  # 三次校准 1.62 过、1.34 不过、1.59 过。方块中心两次最大偏约 1 cm。
  look: {x: -2.50, y: -1.40, theta: 2.415}
  see:  {x: -2.50, y: -1.40, theta: 2.415}
  gate: {x: -2.30, y: -1.20, theta: 3.1416}

# L2 西侧楼梯口，还在 L1 台面上。上楼动作本身是换位，不开进台阶。
l2_stair:
  south: {x: -2.55, y: -1.35, theta: 1.5708}  # 去北边时的走廊南端。回交接区不再绕这里
  west: {x: -2.55, y: 0.00, theta: 1.5708}    # 楼梯同一高度，去北边沿这里走
  foot: {x: -2.15, y: 0.00, theta: 0.0}       # 上楼前停这里，脸朝台面。下楼的朝向用观察点，不在这里另转
  land: {x: -1.32, y: 0.00, theta: 0.0, z: 0.9}  # 刚跨上台沿。z 是规则书台面，不是 Gazebo 网格

spots:
  spot_07:                                     # 近点。从北边朝南放
    lane:  {x: -2.55, y: -1.35,  theta: -1.5708}
    place: {x: -2.70, y: -2.125, theta: -1.5708}
    pre:   {x: -2.70, y: -1.825, theta: -1.5708}
    look:  {x: -2.70, y: -0.40,  theta: -1.5708}
  spot_01:                                     # L1 南部共享区 (0, -2.7)。从西边朝东放。三次全流程正常
    # 人在 L2 北侧时不能直连 lane：那条直线穿 L2 西北角。先到西侧、已经在南边的这个点
    west:  {x: -2.55, y: -2.05,  theta: 0.0}
    lane:  {x: -1.60, y: -2.20,  theta: 0.0}
    place: {x: -0.575, y: -2.700, theta: 0.0}
    pre:   {x: -0.875, y: -2.700, theta: 0.0}
    look:  {x: -2.206, y: -2.05, theta: -0.286}
  spot_03:                                     # 北部自己 (-2.7, 2.7)。从南边朝北放。间隙 15 cm 之后全流程四次正常
    lane:  {x: -2.40, y: -0.60,  theta: 1.5708}
    place: {x: -2.70, y:  2.125, theta: 1.5708}
    pre:   {x: -2.70, y:  1.825, theta: 1.5708}
    look:  {x: -2.70, y:  0.40,  theta: 1.5708}
  spot_08:                                     # L2 红方西南 (−1.25, −1.25)。从北边朝南放，朝向对齐轴
    lane:  {x: -1.25, y: -0.15, theta: -1.5708}
    pre:   {x: -1.25, y: -0.375, theta: -1.5708}
    place: {x: -1.25, y: -0.675, theta: -1.5708}
    look:  {x: -1.25, y: -0.375, theta: -1.5708}
  spot_05:                                     # L2 红方西北 (−1.25, 1.25)。从南边朝北放，朝向对齐轴
    lane:  {x: -1.25, y:  0.15, theta: 1.5708}
    pre:   {x: -1.25, y:  0.375, theta: 1.5708}
    place: {x: -1.25, y:  0.675, theta: 1.5708}
    look:  {x: -1.25, y:  0.375, theta: 1.5708}
  spot_02:                                     # L1 北部共享区 (0, 2.7)。从西边朝东放。空场探路过了，全流程还没跑
    west:  {x: -2.30, y:  2.20,  theta: 1.5708}
    lane:  {x: -1.60, y:  2.20,  theta: 0.0}
    place: {x: -0.575, y:  2.700, theta: 0.0}
    pre:   {x: -0.875, y:  2.700, theta: 0.0}
    look:  {x: -2.206, y:  2.05,  theta: 0.287}
