# cloud_crop（"车体 + 货仓"裁剪框）参数，2026-10-05。盒子都在 base_link 系（原点在底盘底面中心、轮轴高度），
# 扁平写法：每 6 个数一个盒子 [x_min, x_max, y_min, y_max, z_min, z_max]，单位 m。
# ⚠️ 全是占位：底盘 0.3 x 0.3 x 0.15 是 robot_params.yaml 的占位尺寸；货仓按用户说的"方块存在车后、比底盘高 15 cm"、
#    理想化成 850 mm 高的盒子（2 块地块一摞 700 mm + 余量），等机械图纸再改
cloud_crop:
  ros__parameters:
    base_frame: base_link
    lidar_frame: ""               # 空 = 用消息头的 frame_id（仿真 livox_sim，单 Mid-360 真车 lidar_link）
    input_topic: /livox/lidar
    boxes: [
      -0.20, 0.20, -0.20, 0.20, -0.10, 0.20,    # 底盘（各边多 5 cm）。雷达在车头外伸、前倾，其实打不到，留着保险
      -0.40, 0.05, -0.22, 0.22, 0.28, 1.17,     # 货仓：底面 0.15 + 0.15 = 0.30（往下多 2 cm），850 mm 高
    ]
