# 仿真试验：长直道最高 3 m/s，末端按剩余距离减速。
# 停车仍由位置和角度门限判定。实际到底需要多长距离，以 Gazebo 真值为准。
point_navigator:
  ros__parameters:
    max_linear_speed: 3.0           # m/s
    max_angular_speed: 3.0          # rad/s
    max_linear_accel: 8.0           # m/s²
    linear_decel: 6.0               # m/s²
    kp_linear: 3.0                  # 1/s
    max_angular_accel: 6.0          # rad/s²
    angular_decel: 5.0              # rad/s²
    kp_angular: 3.0                 # 1/s
    braking_delay: 0.22            # s，给 TF 数据龄和执行留制动余量
    use_chassis_odom_for_stopping: true
    fine_approach_speed: 0.25       # m/s，最后一段精确直进
